version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - govet
    - ineffassign
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are errcheck's job, with its std-error-handling exclusions
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
