# Derbent preset: strict
#
# Reading is allowed, and so are Derbent's memory tools and the GitHub server's known read tools.
# Everything else asks you first: every shell command, every file edit and every tool of a
# downstream server. Every call is recorded (derbent receipts). An ask nobody answers is denied when
# [approvals] timeout runs out, 50 seconds unless you set it, so keep `derbent` open in a terminal.
#
# Derbent wrote this file once and never changes it (ADR 0016): it is yours to edit. Rules are tried
# from the top and the first match wins. To let a call through without asking, add an allow above
# the asks, for example:
#
#   [[rule]]
#   tool   = "native__Bash"
#   args   = { command = "go test *" }
#   action = "allow"
#
# An args pattern is text, not a shell parser, and can be fooled: `go test ./... && git push` matches
# `go test *`. Keep such allows narrow. `derbent config check` validates the file after an edit.
#
# Each CLI names its built-in tools its own way (native__Bash in Claude Code and Codex, native__bash
# and native__powershell in Copilot CLI, native__run_command in Antigravity CLI, and so on), so the
# read-only tools below are listed per CLI.

# --- Derbent's memory tools, for every agent.

[[rule]]
tool   = "memory_*"
action = "allow"

# --- Built-in tools that only read or keep notes, named exactly, so that a tool a CLI adds later is
# not allowed by accident.

