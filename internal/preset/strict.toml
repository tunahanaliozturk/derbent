# --- The GitHub MCP server, when it sits behind Derbent as [servers.github]: twelve read tools known
# by name are allowed. Change the prefix if your server has another name.

[[rule]]
tool   = "github__get_me"
action = "allow"

[[rule]]
tool   = "github__get_file_contents"
action = "allow"

[[rule]]
tool   = "github__search_code"
action = "allow"

[[rule]]
tool   = "github__search_repositories"
action = "allow"

[[rule]]
tool   = "github__search_issues"
action = "allow"

[[rule]]
tool   = "github__search_pull_requests"
action = "allow"

[[rule]]
tool   = "github__issue_read"
action = "allow"

[[rule]]
tool   = "github__list_issues"
action = "allow"

[[rule]]
tool   = "github__pull_request_read"
action = "allow"

[[rule]]
tool   = "github__list_pull_requests"
action = "allow"

[[rule]]
tool   = "github__list_commits"
action = "allow"

[[rule]]
tool   = "github__get_commit"
action = "allow"

# --- Every other built-in tool (their names start with native__), which covers every shell command
# and every file edit, and every tool of a downstream server (<server>__<tool>) asks.

[[rule]]
tool   = "*__*"
action = "ask"

# --- The last rule must have no condition. Only a tool without "__" in its name reaches it.

[[rule]]
action = "ask"
