# --- File tools writing a .env file or into ~/.ssh ask. A rule with an args condition matches any
# tool that has that argument, so these name the argument each CLI's file tools use. `*.env*` also
# catches .env.local, prod.env and .envrc, and `*.ssh*` catches ~/.ssh with either kind of slash.

[[rule]]
tool   = "native__*"
args   = { file_path = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { file_path = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { path = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { path = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { TargetFile = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { TargetFile = "*.ssh*" }
action = "ask"

# --- File edits sent as a patch, with each file's path inside it. A patch that touches a .env file
# or ~/.ssh, or deletes a file, asks. `*.env*` reads the whole patch, so a patch whose code mentions
# process.env or os.environ asks too. Codex sends the patch in `command`. Copilot CLI's runtime takes
# it as raw text or in `input` or `patch`, and which one its hook sends is not verified, so both keys
# are named here; raw text is not JSON, and derbent gate denies a call whose arguments it cannot read.

[[rule]]
tool   = "native__apply_patch"
args   = { command = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { command = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { command = "*Delete File: *" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { input = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { input = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { input = "*Delete File: *" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { patch = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { patch = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { patch = "*Delete File: *" }
action = "ask"

# Every other patch is allowed here, before the shell rules below: the patch is the argument, and
# code that mentions "git push", or a word ending in "rm", would otherwise ask on every edit.
[[rule]]
tool   = "native__apply_patch"
action = "allow"

# --- Copilot CLI's write_bash and write_powershell type text into a shell that is already running,
# where it can be a command or the answer to a prompt, so they always ask.

[[rule]]
tool   = "native__write_bash"
action = "ask"

[[rule]]
tool   = "native__write_powershell"
action = "ask"

# --- Shell commands that ask, in the groups the top of the file lists; other commands that are hard
# to undo, such as `git branch -D` or `git stash drop`, do not. Each pattern comes twice: for the
# `command` of every CLI's shell tool but Antigravity CLI's, and for Antigravity CLI's `CommandLine`.

# Pushing, also with options before push, as in `git -C repo push`. `*git *push*` also asks about
# `git stash push`, `git log --grep push` and a commit message that mentions push.
[[rule]]
tool   = "native__*"
args   = { command = "*git *push*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*git *push*" }
action = "ask"

# Discarding work: `git reset --hard` and `git checkout ... -- <paths>`, also with other words in
# between (`git reset -q --hard`, `git checkout HEAD -- .`). `*git *checkout *-- *` also asks about a
# later `-- ` in the same line, as in `git checkout main && npm test -- --watch`. Not caught:
# `git restore`, `git checkout .` and `git switch --discard-changes`.
[[rule]]
tool   = "native__*"
args   = { command = "*git *reset *--hard*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*git *reset *--hard*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*git *checkout *-- *" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*git *checkout *-- *" }
action = "ask"

# --force. The short -f of `git push -f` and `rm -f` is caught by the push and delete rules.
# PowerShell's -Force is not a pattern, because `New-Item -Force` is how PowerShell makes a
# directory that may exist; `Remove-Item -Force` asks through the delete rules.
[[rule]]
tool   = "native__*"
args   = { command = "*--force*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*--force*" }
action = "ask"

# Deleting files: rm, rmdir and unlink, also as the last word (`find . | xargs rm`), Remove-Item,
# git clean with a flag, -delete or --delete (find, rsync) and rsync's --remove-source-files. In
# PowerShell, rm is a name for Remove-Item. These also ask about more than they name: `*-delete*`
# about a path such as `soft-delete.ts` and about `gh pr merge --delete-branch`, and `*git *clean -*`
# about `make clean -j4` or `dotnet clean -c Release` after a git command in the same line. Not
# caught: a plain `git clean`, which deletes nothing while clean.requireForce is left at its default
# (true) and deletes untracked files when it is set to false; `del`, `erase`, `rd` and PowerShell's
# `ri` (a pattern for "del" would catch "model x"); `shred`; and a delete done by a script or another
# language.
[[rule]]
tool   = "native__*"
args   = { command = "*rm *" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*rm *" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "* rm" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "* rm" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*rmdir *" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*rmdir *" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "* rmdir" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "* rmdir" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*unlink *" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*unlink *" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "* unlink" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "* unlink" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*Remove-Item*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*Remove-Item*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*git *clean -*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*git *clean -*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*-delete*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*-delete*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*--remove-source-files*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*--remove-source-files*" }
