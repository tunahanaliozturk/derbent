# Derbent preset: balanced
#
# Reading is allowed. Pushing, force flags, deleting files, piping a download into a shell,
# infrastructure commands and writes to .env files and ~/.ssh ask you first, and so does every
# GitHub tool that is not a known read. Everything else is allowed, and every call is recorded
# (derbent receipts).
#
# Derbent wrote this file once and never changes it (ADR 0016): it is yours to edit. Rules are tried
# from the top and the first match wins, so a rule wins over every rule below it. The last rule must
# have no condition. `derbent config check` validates the file after an edit.
#
# Shell rules are text patterns, not a shell parser. `*git push*` matches "git push" anywhere in the
# command, so `cd repo && git push` asks too. They can be fooled, by a variable, an alias, a script
# or other spacing, so they guard against mistakes, not against an agent set on getting past them.
# They are also stricter than they look where they catch too much: `*rm *` catches `git rm`,
# `npm rm` and every word that ends in "rm" before a space, such as "platform x". Patterns are
# case-sensitive.
#
# Each CLI names its built-in tools and their arguments its own way, so the rules cover all four:
#   Claude Code      native__Bash, native__PowerShell, native__Monitor (command)
#                    native__Write, native__Edit (file_path)
#   Codex            native__Bash (command), native__apply_patch (command: the whole patch)
#   Copilot CLI      native__bash, native__powershell (command)
#                    native__create, native__edit (path)
#   Antigravity CLI  native__run_command (CommandLine)
#                    native__write_to_file, native__replace_file_content,
#                    native__multi_replace_file_content (TargetFile)

# --- Derbent's memory tools, for every agent.

[[rule]]
tool   = "memory_*"
action = "allow"

# --- Built-in tools that only read or keep notes, named exactly, so that a tool a CLI adds later is
# not allowed by accident. Reading a .env file with them is allowed; writing one asks, below.

# Claude Code
[[rule]]
tool   = "native__Read"
action = "allow"

[[rule]]
tool   = "native__Glob"
action = "allow"

[[rule]]
tool   = "native__Grep"
action = "allow"

[[rule]]
tool   = "native__LSP"
action = "allow"

[[rule]]
tool   = "native__ToolSearch"
action = "allow"

[[rule]]
tool   = "native__TodoWrite"
action = "allow"

[[rule]]
tool   = "native__TaskCreate"
action = "allow"

[[rule]]
tool   = "native__TaskGet"
action = "allow"

[[rule]]
tool   = "native__TaskList"
action = "allow"

[[rule]]
tool   = "native__TaskUpdate"
action = "allow"

[[rule]]
tool   = "native__AskUserQuestion"
action = "allow"

[[rule]]
tool   = "native__EnterPlanMode"
action = "allow"

[[rule]]
tool   = "native__ExitPlanMode"
action = "allow"

# Codex
[[rule]]
tool   = "native__update_plan"
action = "allow"

[[rule]]
tool   = "native__view_image"
action = "allow"

# Copilot CLI
[[rule]]
tool   = "native__view"
action = "allow"

[[rule]]
tool   = "native__glob"
action = "allow"

[[rule]]
tool   = "native__grep"
action = "allow"

[[rule]]
tool   = "native__rg"
action = "allow"

[[rule]]
tool   = "native__read_bash"
action = "allow"

[[rule]]
tool   = "native__read_powershell"
action = "allow"

[[rule]]
tool   = "native__list_bash"
action = "allow"

[[rule]]
tool   = "native__list_powershell"
action = "allow"

[[rule]]
tool   = "native__ask_user"
action = "allow"

# Antigravity CLI
[[rule]]
tool   = "native__view_file"
action = "allow"

[[rule]]
tool   = "native__list_dir"
