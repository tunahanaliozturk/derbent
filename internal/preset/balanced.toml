[[rule]]
tool   = "native__grep_search"
action = "allow"

# --- Writes to .env files and to ~/.ssh ask. A rule with an args condition matches any tool that has
# that argument, so these name the argument each CLI's file tools use. `*.env*` also catches
# .env.local, prod.env and .envrc, and `*.ssh*` catches ~/.ssh with either kind of slash.

[[rule]]
tool   = "native__*"
args   = { file_path = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { file_path = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { path = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { path = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { TargetFile = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { TargetFile = "*.ssh*" }
action = "ask"

# Codex sends a file edit as a patch in `command`, with each file's path inside it.
[[rule]]
tool   = "native__apply_patch"
args   = { command = "*.env*" }
action = "ask"

[[rule]]
tool   = "native__apply_patch"
args   = { command = "*.ssh*" }
action = "ask"

# Every other Codex patch is allowed here, before the shell rules below: its `command` is the patch,
# and code that mentions "git push", or a word ending in "rm", would otherwise ask on every edit.
[[rule]]
tool   = "native__apply_patch"
action = "allow"

# --- Shell commands that are hard to undo ask. Each pattern comes twice: for the `command` of every
# CLI's shell tool but Antigravity CLI's, and for Antigravity CLI's `CommandLine`.

# Pushing.
[[rule]]
tool   = "native__*"
args   = { command = "*git push*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*git push*" }
action = "ask"

# Force flags. The short -f of `git push -f` and `rm -f` is caught by the push and delete rules.
[[rule]]
tool   = "native__*"
args   = { command = "*--force*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*--force*" }
action = "ask"

# Deleting files. In PowerShell, rm and del are names for Remove-Item; `del` itself is not a pattern
# here, because "model x" holds it.
[[rule]]
tool   = "native__*"
args   = { command = "*rm *" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*rm *" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*Remove-Item*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*Remove-Item*" }
action = "ask"

# A download piped into a shell: curl or wget into sh or bash, or anything piped into iex
# (Invoke-Expression) in PowerShell. `*curl*|*sh*` also catches `curl x | grep shell`.
[[rule]]
tool   = "native__*"
args   = { command = "*curl*|*sh*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*curl*|*sh*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*wget*|*sh*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*wget*|*sh*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*|*iex*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*|*iex*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*Invoke-Expression*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*Invoke-Expression*" }
action = "ask"

# Infrastructure.
[[rule]]
