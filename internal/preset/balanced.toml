# Running a download: curl or wget piped into sh or bash, or run through command substitution
# (`bash -c "$(curl x)"`, `bash <(curl x)`, or backticks as in sh -c "`curl x`"), and in PowerShell
# anything piped into iex or IEX, passed to `iex (`, `iex(`, `IEX (` or `IEX(`, run with
# Invoke-Expression, or fetched with DownloadString. These also ask about more than they name:
# `*curl*|*sh*` about `curl x | grep shell`, `*$(curl*` about any command substitution that calls
# curl, such as `TOKEN=$(curl -s https://x/token | jq -r .t)`, and the backtick patterns about a
# commit message that puts curl or wget in backticks. Not caught: a download saved to a file and run
