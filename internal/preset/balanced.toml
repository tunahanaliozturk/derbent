# Derbent preset: balanced
#
# Reading is allowed. These ask you first: pushing, --force, discarding work with git reset --hard
# or git checkout --, deleting files, running a downloaded script, the terraform, tofu, pulumi,
# kubectl and helm subcommands listed in the infrastructure section, writing a .env file with a file
# tool or a shell redirect, ~/.ssh in a file path or a shell command, text typed into a running
# Copilot CLI shell, and every tool of a GitHub server behind Derbent that is not a known read.
# Everything else is allowed, and every call is recorded (derbent receipts).
#
# Shell rules match text, not meaning, so a command written in a form these patterns do not list gets
# through: a quoted program name (`"git" push`), a variable, an alias, a script, other spacing or a
# program's full name (`git.exe push`). They guard against mistakes, not against an agent set on
# getting past them, until Derbent parses shell commands (an item on its backlog). The strict preset
# asks about every shell command instead.
#
# Derbent wrote this file once and never changes it (ADR 0016): it is yours to edit. Rules are tried
# from the top and the first match wins, so a rule wins over every rule below it. The last rule must
# have no condition. `derbent config check` validates the file after an edit.
#
# A pattern matches anywhere in the command: `*git *push*` matches "git " and then "push", so
# `cd repo && git push` and `git -C repo push` ask too. Patterns also catch more than they name, and
# each section below says where: `*rm *` catches `git rm`, `npm rm`, every terraform command
# ("terraform " ends in "rm ") and every word that ends in "rm" before a space, such as "platform x".
# Patterns are case-sensitive and PowerShell is not, so `remove-item` gets past `*Remove-Item*`.
#
# Each CLI names its built-in tools and their arguments its own way, so the rules cover all four:
#   Claude Code      native__Bash, native__PowerShell, native__Monitor (command)
#                    native__Write, native__Edit (file_path)
#   Codex            native__Bash (command), native__apply_patch (command: the whole patch)
#   Copilot CLI      native__bash, native__powershell (command)
#                    native__write_bash, native__write_powershell (input: text for a running shell)
#                    native__create, native__edit (path)
#                    native__apply_patch (the whole patch, in input or patch: not verified)
#   Antigravity CLI  native__run_command (CommandLine)
#                    native__write_to_file, native__replace_file_content,
#                    native__multi_replace_file_content (TargetFile)

# --- Derbent's memory tools, for every agent.

[[rule]]
tool   = "memory_*"
action = "allow"

