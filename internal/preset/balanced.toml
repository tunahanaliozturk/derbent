[[rule]]
tool   = "native__*"
args   = { command = "*pulumi*import*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*pulumi*import*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*tofu*import*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*tofu*import*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*tofu*taint*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*tofu*taint*" }
action = "ask"

# --- The GitHub MCP server, when it sits behind Derbent as [servers.github]: twelve read tools known
# by name are allowed, and every other GitHub tool asks, because the server writes under many names,
# such as issue_write and add_issue_comment. Change the prefix if your server has another name. A
# GitHub server set up in the CLI itself, not behind Derbent, reaches these rules through the hook
# under the CLI's own name, such as native__mcp__github__issue_write in Claude Code, and the last
# rule allows it.

[[rule]]
tool   = "github__get_me"
action = "allow"

[[rule]]
tool   = "github__get_file_contents"
action = "allow"

[[rule]]
tool   = "github__search_code"
action = "allow"

[[rule]]
tool   = "github__search_repositories"
action = "allow"

[[rule]]
tool   = "github__search_issues"
action = "allow"

[[rule]]
tool   = "github__search_pull_requests"
action = "allow"

[[rule]]
tool   = "github__issue_read"
action = "allow"

[[rule]]
tool   = "github__list_issues"
action = "allow"

[[rule]]
tool   = "github__pull_request_read"
action = "allow"

[[rule]]
tool   = "github__list_pull_requests"
action = "allow"

[[rule]]
tool   = "github__list_commits"
action = "allow"

[[rule]]
tool   = "github__get_commit"
action = "allow"

[[rule]]
tool   = "github__*"
action = "ask"

# --- Everything else is allowed.

[[rule]]
action = "allow"
