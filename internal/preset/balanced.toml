# ~/.ssh in a command asks, a read such as `cat ~/.ssh/config` too, since a pattern cannot tell a
# read from a write. A .env file asks only after a redirect (`> .env`, `>> prod.env`), so reading
# one does not ask, and `*>*.env*` also asks when any > comes before a .env, as in
# `make 2>/dev/null; cat .env`. Not caught: writing a .env file with cp, mv, tee, sed -i or
# curl -o, or with PowerShell's Set-Content, Add-Content, Out-File or New-Item -Value.
[[rule]]
tool   = "native__*"
args   = { command = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*.ssh*" }
action = "ask"

[[rule]]
tool   = "native__*"
args   = { command = "*>*.env*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*>*.env*" }
action = "ask"

# Infrastructure. These subcommands ask, also with options before them (`kubectl -n prod delete`):
#   terraform  apply, destroy (and every other terraform command, through `*rm *` above)
#   tofu       apply, destroy, import, taint
#   pulumi     up, destroy, refresh, import
#   kubectl    apply, delete, create, replace, patch, edit, scale, set, drain, rollout restart,
#              rollout undo
#   helm       install, upgrade, rollback, uninstall, delete, del
# The terraform rules still catch `terraform.exe apply`, and keep apply and destroy asking if you
# narrow the delete rule. Reads such as `kubectl get`, `kubectl describe`, `kubectl logs`,
# `helm list` and `helm template` are allowed; they are not named in an allow rule, because a
# pattern allow above these asks would let `kubectl get x && kubectl delete y` through. Not caught:
# every subcommand the list leaves out, such as `kubectl cordon`, `kubectl label`,
# `kubectl annotate`, `kubectl expose`, `helm repo remove` or `helm push`. These also ask about more
# than they name: `*terraform*apply*` about `git apply` in a terraform/ directory; `*pulumi*up*` about
# any pulumi command with "up" in it, such as `pulumi preview --suppress-outputs`, about anything
# after a path that holds "pulumi", such as `cd infra/pulumi && npm run setup`, and about
# `pip install pulumi --upgrade`; `*kubectl *create*` about `kubectl create --dry-run=client`; and
# `*helm *del *` about a helm command with a word that ends in "del" before a space.
[[rule]]
tool   = "native__*"
args   = { command = "*terraform*apply*" }
action = "ask"

[[rule]]
tool   = "native__run_command"
args   = { CommandLine = "*terraform*apply*" }
action = "ask"

