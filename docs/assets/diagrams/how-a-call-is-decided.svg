<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="430" rx="12" fill="#FFFFFF"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0B0F14"/></marker>
  </defs>

  <!-- Top row: the checks -->
  <rect x="24" y="40" width="170" height="80" rx="8" fill="#F5F5F0" stroke="#0B0F14" stroke-width="1.5"/>
  <text x="109" y="76" text-anchor="middle" font-size="16" fill="#0B0F14">a tool call</text>
  <text x="109" y="98" text-anchor="middle" font-size="13" fill="#5B6470">agent, tool, arguments</text>

  <rect x="262" y="40" width="200" height="80" rx="8" fill="#0F8B8D"/>
  <text x="362" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">your rules</text>
  <text x="362" y="94" text-anchor="middle" font-size="13" fill="#FFFFFF">config.toml</text>
  <text x="362" y="111" text-anchor="middle" font-size="13" fill="#FFFFFF">first match wins</text>

  <rect x="530" y="40" width="200" height="80" rx="8" fill="#0F8B8D"/>
  <text x="630" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">project rules</text>
  <text x="630" y="94" text-anchor="middle" font-size="13" fill="#FFFFFF">.derbent.toml</text>
  <text x="630" y="111" text-anchor="middle" font-size="13" fill="#FFFFFF">can only make it stricter</text>

  <rect x="766" y="40" width="170" height="80" rx="8" fill="#0F8B8D"/>
  <text x="851" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">budgets</text>
  <text x="851" y="94" text-anchor="middle" font-size="13" fill="#FFFFFF">calls per window</text>
  <text x="851" y="111" text-anchor="middle" font-size="13" fill="#FFFFFF">over it: refused</text>

  <g stroke="#0B0F14" stroke-width="1.5" fill="none">
    <line x1="194" y1="80" x2="260" y2="80" marker-end="url(#a)"/>
    <line x1="462" y1="80" x2="528" y2="80" marker-end="url(#a)"/>
    <line x1="730" y1="80" x2="764" y2="80" marker-end="url(#a)"/>
    <!-- down from budgets to the three verdicts -->
    <polyline points="851,120 851,160 150,160 150,196" marker-end="url(#a)"/>
    <line x1="480" y1="160" x2="480" y2="196" marker-end="url(#a)"/>
    <line x1="810" y1="160" x2="810" y2="196"/>
    <line x1="810" y1="160" x2="810" y2="196" marker-end="url(#a)"/>
  </g>

  <!-- Verdicts -->
  <rect x="40" y="198" width="220" height="104" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="150" y="230" text-anchor="middle" font-size="17" font-weight="600" fill="#2E7D32">allow</text>
  <text x="150" y="256" text-anchor="middle" font-size="13" fill="#0B0F14">the call goes through</text>
  <text x="150" y="276" text-anchor="middle" font-size="13" fill="#0B0F14">to the server or the CLI</text>

  <rect x="340" y="198" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/>
  <text x="480" y="230" text-anchor="middle" font-size="17" font-weight="600" fill="#B7791F">ask</text>
  <text x="480" y="256" text-anchor="middle" font-size="13" fill="#0B0F14">held until you press a (once), A (session)</text>
  <text x="480" y="276" text-anchor="middle" font-size="13" fill="#0B0F14">or d (deny); unanswered after 50 s: denied</text>

  <rect x="700" y="198" width="220" height="104" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="2.5"/>
  <text x="810" y="230" text-anchor="middle" font-size="17" font-weight="600" fill="#C62828">deny</text>
  <text x="810" y="256" text-anchor="middle" font-size="13" fill="#0B0F14">refused, and the agent</text>
  <text x="810" y="276" text-anchor="middle" font-size="13" fill="#0B0F14">is told why</text>

  <g stroke="#0B0F14" stroke-width="1.5" fill="none">
    <line x1="150" y1="302" x2="150" y2="340" marker-end="url(#a)"/>
    <line x1="480" y1="302" x2="480" y2="340" marker-end="url(#a)"/>
    <line x1="810" y1="302" x2="810" y2="340" marker-end="url(#a)"/>
  </g>

  <rect x="40" y="342" width="880" height="60" rx="8" fill="#F5F5F0" stroke="#0B0F14" stroke-width="1.5"/>
  <text x="480" y="368" text-anchor="middle" font-size="16" fill="#0B0F14">one receipt per call, chained to the one before it</text>
  <text x="480" y="389" text-anchor="middle" font-size="13" fill="#5B6470">who called what, with masked arguments, what decided it, and the size and hash of the result</text>
</svg>
